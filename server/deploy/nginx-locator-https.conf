# Phone Locator — public HTTPS for kklasmei.mooo.com
# Install: bash server/deploy/install-https-pisensors.sh
#
# Phone app base URL:  https://kklasmei.mooo.com
# Web dashboard (later): https://kklasmei.mooo.com/locator/
# Backend: FastAPI on 127.0.0.1:8003

server {
    listen 80;
    listen [::]:80;
    server_name kklasmei.mooo.com;

    # Let's Encrypt HTTP-01 challenge (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS after cert is issued.
    # install-https-pisensors.sh enables this after the first successful certbot run.
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # Temporary: allow HTTP API until certbot adds the 443 server block.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8003/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /favicon.ico {
        proxy_pass http://127.0.0.1:8003/favicon.ico;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /locator/ {
        proxy_pass http://127.0.0.1:8003/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /locator {
        return 301 /locator/;
    }
}

# After certbot, it adds a matching listen 443 ssl block (or a separate server {}).
# If certbot does not merge automatically, copy this block, add ssl_certificate paths,
# and listen 443 ssl.
