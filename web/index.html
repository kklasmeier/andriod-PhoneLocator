<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Phone Locator</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css?v=1.9.11" />
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="Phone Locator home">
      <span class="brand-icon">📍</span>
      <span class="brand-title">Phone Locator</span>
    </a>
    <nav class="nav" id="main-nav">
      <a href="#/" data-route="/">Home</a>
      <a href="#/map" data-route="/map">Map</a>
      <a href="#/timeline" data-route="/timeline">Timeline</a>
      <a href="#/places" data-route="/places">Places</a>
      <a href="#/travel" data-route="/travel">Travel</a>
      <a href="#/history" data-route="/history">History</a>
      <a href="#/settings" data-route="/settings">Settings</a>
    </nav>
    <div class="period-bar" id="period-bar">
      <div class="period-date-row">
        <button type="button" class="period-nav secondary" id="period-prev" aria-label="Previous period">◀</button>
        <label class="period-label" id="period-label" title="Pick a date">
          <span id="period-label-text">Today</span>
          <input type="date" id="period-date" class="period-date-input" aria-label="Select date" />
        </label>
        <button type="button" class="period-nav secondary" id="period-next" aria-label="Next period">▶</button>
        <button type="button" class="period-today secondary" id="period-today">Today</button>
      </div>
      <div class="period-granularity" role="group" aria-label="View by">
        <button type="button" class="secondary active" data-granularity="day">Day</button>
        <button type="button" class="secondary" data-granularity="week">Week</button>
        <button type="button" class="secondary" data-granularity="month">Month</button>
        <button type="button" class="secondary" data-granularity="year">Year</button>
      </div>
    </div>
  </header>

  <div id="banner" class="banner hidden"></div>
  <main id="app" class="app">
    <div class="loading" id="boot-status">Loading…</div>
  </main>
  <footer id="site-footer" class="site-footer">Phone Locator · loading…</footer>

  <script>
    (function () {
      var footer = document.getElementById("site-footer");
      var app = document.getElementById("app");
      function showBootError(message) {
        if (app && (!app.innerHTML || app.innerHTML.indexOf("boot-status") !== -1)) {
          app.innerHTML =
            '<div class="empty"><p><strong>Dashboard failed to start</strong></p><p>' +
            message +
            '</p><p>Add <code>?debug=1</code> to the URL for a mobile console.</p></div>';
        }
        if (footer) footer.textContent = "Boot error: " + message;
      }
      window.addEventListener("error", function (e) {
        showBootError(e.message || "Unknown script error");
      });
      window.addEventListener("unhandledrejection", function (e) {
        var reason = e.reason && e.reason.message ? e.reason.message : String(e.reason);
        showBootError(reason);
      });
      if (location.search.indexOf("debug=1") !== -1) {
        var s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/eruda";
        s.onload = function () {
          eruda.init();
        };
        document.body.appendChild(s);
      }
    })();
  </script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/app.js?v=1.9.11"></script>
</body>
</html>
